<text x="1030" y="811" text-anchor="middle" font-size="11" fill="#8b93a7">(viewer id)</text>
<line x1="1030" y1="820" x2="1030" y2="846" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="900" y="846" width="260" height="36" rx="10" fill="#171a21" stroke="#4f7cff" stroke-width="1.5"/>
<text x="1030" y="869" text-anchor="middle" font-size="12.5" fill="#eef1f6">Poll answer (now + 1s)</text>
<line x1="1030" y1="882" x2="1030" y2="908" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<polygon points="1030,908 1130,936 1030,964 930,936" fill="#171a21" stroke="#22c55e" stroke-width="2"/>
<text x="1030" y="940" text-anchor="middle" font-size="11.5" fill="#eef1f6">answer?</text>
<polyline points="930,936 865,936 865,864 900,864" fill="none" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="918" y="930" font-size="10" fill="#ffd479">no</text>
<text x="900" y="946" text-anchor="middle" font-size="10" fill="#8b93a7">12s→toast</text>
<text x="1042" y="982" font-size="10" fill="#ffd479">yes</text>
<line x1="1030" y1="964" x2="1030" y2="990" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="900" y="990" width="260" height="40" rx="10" fill="#171a21" stroke="#4f7cff" stroke-width="1.5"/>
<text x="1030" y="1014" text-anchor="middle" font-size="12.5" fill="#eef1f6">Watch P2P stream</text>
<line x1="1030" y1="1030" x2="1030" y2="1056" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<polygon points="1030,1056 1135,1084 1030,1112 925,1084" fill="#171a21" stroke="#22c55e" stroke-width="2"/>
<text x="1030" y="1088" text-anchor="middle" font-size="11.5" fill="#eef1f6">link drops?</text>
<polyline points="925,1084 895,1084 895,1138" fill="none" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="910" y="1076" font-size="10" fill="#ffd479">yes</text>
<rect x="860" y="1138" width="150" height="44" rx="10" fill="#171a21" stroke="#4f7cff" stroke-width="1.5"/>
<text x="935" y="1156" text-anchor="middle" font-size="11.5" fill="#eef1f6">retry w/ backoff</text>
<text x="935" y="1170" text-anchor="middle" font-size="10.5" fill="#8b93a7">(same id)</text>
<polyline points="915,1182 915,1330 1195,1330 1195,800 1160,800" fill="none" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="1042" y="1165" font-size="10" fill="#ffd479">no</text>
<line x1="1030" y1="1112" x2="1030" y2="1210" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="930" y="1210" width="200" height="44" rx="10" fill="#171a21" stroke="#ef4444" stroke-width="1.5"/>
<text x="1030" y="1236" text-anchor="middle" font-size="12.5" fill="#eef1f6">X → POST leave</text>
<line x1="1030" y1="1254" x2="1030" y2="1298" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="1030" cy="1310" r="10" fill="none" stroke="#ef4444" stroke-width="2"/>
<circle cx="1030" cy="1310" r="5" fill="#ef4444"/>

<!-- ============ cross-lane API arrows ============ -->
<line x1="900" y1="638" x2="740" y2="638" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="820" y="630" text-anchor="middle" font-size="11" fill="#9db4ff">GET rooms</text>
