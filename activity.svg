<line x1="900" y1="864" x2="770" y2="864" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="835" y="856" text-anchor="middle" font-size="11" fill="#9db4ff">poll answer</text>
<line x1="770" y1="880" x2="900" y2="880" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="835" y="894" text-anchor="middle" font-size="11" fill="#9db4ff">answer</text>
<line x1="340" y1="980" x2="470" y2="980" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="405" y="972" text-anchor="middle" font-size="11" fill="#9db4ff">POST answer</text>
<line x1="930" y1="1232" x2="740" y2="1232" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="835" y="1224" text-anchor="middle" font-size="11" fill="#9db4ff">POST leave</text>

<!-- direct P2P media -->
<line x1="340" y1="1360" x2="900" y2="1360" stroke="#4f7cff" stroke-width="2.5" marker-start="url(#arrBs)" marker-end="url(#arrB)"/>
<text x="620" y="1350" text-anchor="middle" font-size="12" font-weight="bold" fill="#9db4ff">WebRTC media — direct browser ↔ browser (no server)</text>
