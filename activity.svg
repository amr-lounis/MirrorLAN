<polyline points="930,710 865,710 865,648 900,648" fill="none" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="918" y="704" font-size="10" fill="#ffd479">no</text>
<text x="1042" y="762" font-size="10" fill="#ffd479">yes</text>
<line x1="1030" y1="738" x2="1030" y2="780" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arr)"/>
