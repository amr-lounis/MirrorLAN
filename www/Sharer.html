<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MirrorLAN — Sharer</title>
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/sharer.css">
</head>
<body>
<div class="stage" id="stage">
<video id="preview" autoplay muted playsinline></video>
<div class="count" id="count">0</div>
<div class="aud" id="aud" title="audio track"></div>
<div class="toast" id="toast"></div>
<div class="bar" id="bar">
<button id="share" title="Share" aria-label="Share"><svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/></svg></button>
<button id="stop" class="danger" title="Stop" aria-label="Stop" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1"/></svg></button>
<button id="full" class="blue" title="Fullscreen" aria-label="Fullscreen"></button>
</div>
</div>
<script src="js/shared.js"></script>
<script src="js/sharer.js"></script>
</body>
</html>
