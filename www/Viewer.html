<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MirrorLAN — Viewer</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div class="stage" id="stage">
<video id="remote" autoplay playsinline></video>
<div class="toast" id="toast"></div>
<div class="stat" id="stat" style="display:none"></div>
<div class="bar" id="bar">
<button id="watch" title="Watch" aria-label="Watch"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
<button id="mute" title="Mute" aria-label="Mute" style="display:none"></button>
<input id="vol" class="vol" type="range" min="0" max="100" value="100" aria-label="Volume" style="display:none">
<button id="noaud" class="ghost" title="No audio in this stream" aria-label="No audio" disabled style="display:none"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16 9l6 6M22 9l-6 6"/></svg></button>
<button id="leave" title="Leave" aria-label="Leave"><svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<button id="full" title="Fullscreen" aria-label="Fullscreen"></button>
</div>
</div>
<script src="shared.js"></script>
<script src="viewer.js"></script>
</body>
</html>
