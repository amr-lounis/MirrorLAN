<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='17' rx='3' fill='%2322c55e'/%3E%3Cpath d='M12 26h8M16 23v3' stroke='%23eef1f6' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<title>MirrorLAN — Rooms</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:#eef1f6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:32px 16px 48px;
  background:radial-gradient(900px 480px at 50% -120px,rgba(79,124,255,.14),transparent 70%),#0f1115}
.wrap{width:100%;max-width:560px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{position:relative;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 18px rgba(34,197,94,.35)}
.logo svg{display:block}
.brand h1{font-size:21px;margin:0;letter-spacing:.2px}
.brand small{display:block;font-size:12px;color:#8b93a7;font-weight:400}
.sub{color:#8b93a7;font-size:13px;margin:0 0 20px}
.sechead{display:flex;align-items:center;gap:8px;margin:20px 0 10px}
.sechead h2{font-size:12px;color:#8b93a7;margin:0;font-weight:700;letter-spacing:1px}
.count{min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);color:#4ade80;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:12px;background:#171a21;border:1px solid #2a2f3a;border-radius:14px;padding:12px 14px;margin:10px 0;transition:transform .15s,border-color .15s,box-shadow .15s}
.row:hover{transform:translateY(-1px);border-color:#4f7cff;box-shadow:0 6px 20px rgba(79,124,255,.15)}
.dot{position:relative;width:10px;height:10px;border-radius:50%;background:#22c55e;flex:none}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(34,197,94,.5);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.3);opacity:0}}
.name{flex:1;font-family:Consolas,monospace;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{background:#4f7cff;color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:6px}
button:active{transform:scale(.96)}
.row button{background:linear-gradient(135deg,#5b86ff,#3b63e0);box-shadow:0 3px 12px rgba(79,124,255,.35)}
.row button:hover{filter:brightness(1.1)}
.emptybox{border:1.5px dashed #2a2f3a;border-radius:14px;padding:26px 16px;text-align:center;color:#8b93a7;font-size:13px}
.emptybox svg{opacity:.5;margin-bottom:8px}
.err{color:#ef4444;font-size:13px;padding:12px 2px;display:none;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:10px;margin-top:10px}
.divider{display:flex;align-items:center;gap:10px;color:#4a5162;font-size:11px;margin:24px 0 14px;letter-spacing:1px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#2a2f3a}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#04120a;font-weight:800;font-size:15px;text-decoration:none;box-shadow:0 6px 24px rgba(34,197,94,.3);transition:transform .15s,filter .15s}
.cta:hover{filter:brightness(1.07)}
.cta:active{transform:scale(.98)}
.hint{margin-top:14px;text-align:center;color:#4a5162;font-size:12px}
@media (prefers-reduced-motion:reduce){.dot::after{animation:none}.row,.cta,button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">
<span class="logo"><svg viewBox="0 0 24 24" width="22" height="22" stroke="#04120a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/></svg></span>
<h1>MirrorLAN<small>LAN screen sharing</small></h1>
</div>
<p class="sub">Watch a live screen on your network.</p>
<div class="sechead"><h2>LIVE</h2><span class="count" id="livecount">0</span></div>
<div id="list"><div class="emptybox" id="empty"><svg viewBox="0 0 24 24" width="30" height="30" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/></svg><br>No live rooms right now.</div></div>
<div class="err" id="err">Cannot reach server — open this page via http://SERVER:PORT/ instead of file://</div>
<div class="divider">SHARE FROM THIS DEVICE</div>
<a class="cta" href="myshares.html"><span style="font-size:19px;line-height:1">+</span> My Shares — start sharing</a>
<p class="hint">Tip: keep the sharing tab open while viewers are watching.</p>
</div>
<script src="shared.js"></script>
<script>
const WATCH_ICON = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
async function refresh(){
  try{
    const r = await fetch('api/rooms');
    if(!r.ok) throw new Error(r.status);
    $('err').style.display = 'none';
    const data = await r.json();
    const box = $('list');
    box.querySelectorAll('.row').forEach(e => e.remove());
    const rooms = (data.rooms || []).filter(x => x.live);
    $('empty').style.display = rooms.length ? 'none' : 'block';
    $('livecount').textContent = rooms.length;
    for(const x of rooms){
      const row = document.createElement('div');
      row.className = 'row';
      const dot = document.createElement('span');
      dot.className = 'dot';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = x.room || '(default)';
      const btn = document.createElement('button');
      btn.innerHTML = WATCH_ICON + 'Watch';
      const room = x.room;
      btn.onclick = () => { location.href = 'Viewer.html' + (room ? '?room=' + encodeURIComponent(room) : ''); };
      row.append(dot, name, btn);
      box.append(row);
    }
  }catch(e){ $('err').style.display = 'block'; }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
